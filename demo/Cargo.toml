[package]
name = "hmi-dioxus-demo"
version.workspace = true
edition = "2021"
publish = false

[dependencies]
dioxus = { version = "0.7" }
hmi-dioxus = { path = ".." }

# `dx serve --platform <p>` builds with `--no-default-features --features <p>`.
# One platform stays `default` so plain `cargo` / rust-analyzer have a target.
[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
