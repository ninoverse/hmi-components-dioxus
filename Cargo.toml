[workspace]
members = ["demo", "xtask"]
resolver = "2"

# Both publishable crates share one repo-owned version (the demo inherits it too),
# kept deliberately independent of the wrapped npm package version.
[workspace.package]
version = "0.3.2"

[package]
name = "hmi-dioxus"
version.workspace = true
edition = "2021"
license = "MIT"
description = "Typed Dioxus 0.7 wrappers for the @ninoverse/hmi-components web components"

# Renderer-agnostic: the `lib` feature pulls in the core (macros, rsx/html,
# signals, hooks, document, asset) without any platform renderer or `launch`.
# The consuming binary (web/desktop/mobile) brings its own renderer.
[dependencies]
dioxus = { version = "0.7", default-features = false, features = ["lib"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
