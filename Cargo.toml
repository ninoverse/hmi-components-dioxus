[workspace]
members = ["demo", "xtask"]
resolver = "2"

# Both publishable crates share one repo-owned version (the demo inherits it too),
# kept deliberately independent of the wrapped npm package version.
[workspace.package]
version = "1.2.0"
# MSRV: matches the Dioxus 0.7 toolchain floor (dioxus declares rust-version 1.83).
rust-version = "1.83"

[package]
name = "hmi-dioxus"
version.workspace = true
rust-version.workspace = true
edition = "2021"
license = "MIT"
description = "Typed Dioxus 0.7 wrappers for the @ninoverse/hmi-components web components"
repository = "https://github.com/ninoverse/hmi-components-dioxus"
documentation = "https://docs.rs/hmi-dioxus"
readme = "README.md"
keywords = ["dioxus", "web-components", "ui", "components", "wasm"]
categories = ["gui", "web-programming", "wasm"]
# The published .crate ships only the library + vendored bundle; dev-only and
# sibling-crate paths are dropped so docs.rs and `cargo add` stay lean.
exclude = [
    "/demo",
    "/xtask",
    "/docs",
    "/.claude",
    "/.github",
    "/.firebaserc",
    "/firebase.json",
    "/CLAUDE.md",
    "/TODO.md",
]

# Renderer-agnostic by default; the optional `web` feature pulls the web-only
# deps needed to wire DOM CustomEvent listeners for interactive components. The
# crate must still build with the feature off (docs.rs, non-web renderers).
[features]
web = ["dep:web-sys", "dep:wasm-bindgen"]

# Renderer-agnostic: the `lib` feature pulls in the core (macros, rsx/html,
# signals, hooks, document, asset) without any platform renderer or `launch`.
# The consuming binary (web/desktop/mobile) brings its own renderer.
[dependencies]
dioxus = { version = "0.7", default-features = false, features = ["lib"] }
wasm-bindgen = { version = "0.2", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "Element",
    "EventTarget",
    "Event",
    "CustomEvent",
] }

[profile.release]
opt-level = "z"
lto = true
strip = true
